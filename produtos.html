<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos — LARGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section" style="padding-top: 3rem;">
    <div class="wrap">
      <div class="section-head">
        <div>
          <span class="eyebrow">Catálogo completo</span>
          <h2 style="margin-top: 0.4rem;">Produtos</h2>
        </div>
        <div class="filters" id="filters"></div>
      </div>
      <div class="grid" id="productsGrid"></div>
    </div>
  </section>

  <footer>
    <div class="wrap footer-inner">
      <span>LARGO — objetos para o cotidiano</span>
      <span>© 2026 LARGO. Todos os direitos reservados.</span>
    </div>
  </footer>

  <script src="assets/products.js"></script>
  <script src="assets/cart.js"></script>
  <script src="assets/menu.js"></script>
  <script type="module" src="assets/firebase.js"></script>
  <script>
    const grid = document.getElementById("productsGrid");
    const filtersEl = document.getElementById("filters");
    const categories = ["Todos", ...new Set(PRODUCTS.map((p) => p.category))];

    function renderGrid(category) {
      const items = category === "Todos" ? PRODUCTS : PRODUCTS.filter((p) => p.category === category);
      grid.innerHTML = items
        .map(
          (p) => `<div class="card">
            <div class="card-img"><img src="${p.img}" alt="${p.name}" /></div>
            <span class="ref">${p.ref} — ${p.category}</span>
            <h3>${p.name}</h3>
            <span class="price">${formatBRL(p.price)}</span>
            <button class="btn btn-outline btn-sm" onclick="addToCart('${p.id}'); this.textContent='Adicionado ✓'; setTimeout(()=>this.textContent='Adicionar', 1200)">Adicionar</button>
          </div>`
        )
        .join("");
    }

    filtersEl.innerHTML = categories
      .map((c, i) => `<button class="filter-btn${i === 0 ? " is-active" : ""}" data-cat="${c}">${c}</button>`)
      .join("");

    filtersEl.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        filtersEl.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("is-active"));
        btn.classList.add("is-active");
        renderGrid(btn.dataset.cat);
      });
    });

    renderGrid("Todos");
  </script>
</body>
</html>
