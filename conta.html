<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha conta — LARGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section" style="padding-top: 3rem;">
    <div class="wrap">
      <span class="eyebrow">Minha conta</span>

      <!-- Visível quando NÃO logado -->
      <div id="authForms" style="margin-top: 1.5rem; max-width: 420px;">
        <button class="btn btn-outline" id="googleBtn" style="width: 100%; justify-content: center; margin-bottom: 1.5rem;">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16 4 9.1 8.5 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.4 27 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9 39.4 15.9 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.6 5.4C41.6 35.6 44 30.2 44 24c0-1.3-.1-2.7-.4-3.5z"/>
          </svg>
          Entrar com Google
        </button>

        <div style="display:flex; align-items:center; gap: 0.75rem; margin-bottom: 1.5rem;">
          <div style="flex:1; height:1px; background: var(--line);"></div>
          <span style="font-size: 0.75rem; color: var(--ink-soft);">ou</span>
          <div style="flex:1; height:1px; background: var(--line);"></div>
        </div>

        <div style="display:flex; gap: 0.5rem; margin-bottom: 2rem;">
          <button class="filter-btn is-active" id="tabLogin">Entrar</button>
          <button class="filter-btn" id="tabSignup">Criar conta</button>
        </div>

        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">E-mail</label>
            <input id="loginEmail" type="email" required />
          </div>
          <div class="field">
            <label for="loginPassword">Senha</label>
            <input id="loginPassword" type="password" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary">Entrar</button>
          <p id="loginError" style="color: var(--brick); font-size: 0.85rem; margin-top: 0.75rem;"></p>
        </form>

        <form id="signupForm" style="display:none;">
          <div class="field">
            <label for="signupName">Nome</label>
            <input id="signupName" type="text" required />
          </div>
          <div class="field">
            <label for="signupEmail">E-mail</label>
            <input id="signupEmail" type="email" required />
          </div>
          <div class="field">
            <label for="signupPassword">Senha (mín. 6 caracteres)</label>
            <input id="signupPassword" type="password" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary">Criar conta</button>
          <p id="signupError" style="color: var(--brick); font-size: 0.85rem; margin-top: 0.75rem;"></p>
        </form>
      </div>

      <!-- Visível quando logado -->
      <div id="accountArea" style="display:none; margin-top: 1.5rem;">
        <h2 id="welcomeMsg" style="font-size: 1.6rem; margin-bottom: 0.5rem;"></h2>
        <button class="btn btn-outline btn-sm" id="logoutBtn" style="margin-bottom: 2.5rem;">Sair da conta</button>

        <h3 style="font-family: var(--font-display); font-size: 1.2rem; margin-bottom: 1rem;">Meus pedidos</h3>
        <div id="ordersList"><p style="color: var(--ink-soft); font-size: 0.9rem;">Carregando pedidos…</p></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap footer-inner">
      <span>LARGO — objetos para o cotidiano</span>
      <span>© 2026 LARGO. Todos os direitos reservados.</span>
    </div>
  </footer>

  <script src="assets/products.js"></script>
  <script src="assets/cart.js"></script>
  <script src="assets/menu.js"></script>
  <script type="module" src="assets/firebase.js"></script>

  <script>
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    document.getElementById("googleBtn").addEventListener("click", async () => {
      try {
        await window.largoSignInWithGoogle();
      } catch (err) {
        console.error(err);
        alert("Não foi possível entrar com o Google. Tente novamente.");
      }
    });

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("is-active");
      tabSignup.classList.remove("is-active");
      loginForm.style.display = "block";
      signupForm.style.display = "none";
    });
    tabSignup.addEventListener("click", () => {
      tabSignup.classList.add("is-active");
      tabLogin.classList.remove("is-active");
      signupForm.style.display = "block";
      loginForm.style.display = "none";
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      const errorEl = document.getElementById("loginError");
      errorEl.textContent = "";
      try {
        await window.largoSignIn(email, password);
      } catch (err) {
        errorEl.textContent = "Não foi possível entrar. Confira o e-mail e a senha.";
        console.error(err);
      }
    });

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("signupName").value;
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;
      const errorEl = document.getElementById("signupError");
      errorEl.textContent = "";
      try {
        await window.largoSignUp(name, email, password);
      } catch (err) {
        errorEl.textContent = "Não foi possível criar a conta. O e-mail já pode estar em uso.";
        console.error(err);
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => window.largoSignOut());

    async function renderOrders(uid) {
      const ordersList = document.getElementById("ordersList");
      try {
        const orders = await window.largoGetOrders(uid);
        if (orders.length === 0) {
          ordersList.innerHTML = `<p style="color: var(--ink-soft); font-size: 0.9rem;">Você ainda não fez nenhum pedido.</p>`;
          return;
        }
        ordersList.innerHTML = orders
          .map(
            (o) => `<div class="cart-row" style="align-items:flex-start;">
              <div class="info">
                <span class="name">Pedido — ${o.items?.length || 0} ite${o.items?.length === 1 ? "m" : "ns"}</span>
                <span class="ref">Status: ${o.status}</span>
              </div>
              <span class="price">${formatBRL(o.total || 0)}</span>
            </div>`
          )
          .join("");
      } catch (err) {
        ordersList.innerHTML = `<p style="color: var(--brick); font-size: 0.85rem;">Não foi possível carregar os pedidos.</p>`;
        console.error(err);
      }
    }

    document.addEventListener("largo-auth-changed", (e) => {
      const user = e.detail.user;
      const authForms = document.getElementById("authForms");
      const accountArea = document.getElementById("accountArea");

      if (user) {
        authForms.style.display = "none";
        accountArea.style.display = "block";
        document.getElementById("welcomeMsg").textContent = `Olá, ${user.displayName || user.email}`;
        renderOrders(user.uid);
      } else {
        authForms.style.display = "block";
        accountArea.style.display = "none";
      }
    });
  </script>
</body>
</html>
