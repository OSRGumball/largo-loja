<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato — LARGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section" style="padding-top: 3rem;">
    <div class="wrap split">
      <div>
        <span class="eyebrow">Fale com a gente</span>
        <h2 style="margin-top: 0.6rem; font-family: var(--font-display); font-size: 1.8rem;">Dúvidas, trocas ou parcerias com ateliês — escreva.</h2>

        <form style="margin-top: 2rem;" onsubmit="event.preventDefault(); this.querySelector('.btn').textContent='Mensagem enviada ✓';">
          <div class="field">
            <label for="nome">Nome</label>
            <input id="nome" type="text" required />
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" type="email" required />
          </div>
          <div class="field">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Enviar mensagem</button>
        </form>
      </div>

      <div class="prose">
        <p><strong>E-mail</strong><br />contato@largo.com.br</p>
        <p><strong>Horário de atendimento</strong><br />Segunda a sexta, das 9h às 18h</p>
        <p><strong>Envios</strong><br />Para todo o Brasil, via transportadora parceira.</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap footer-inner">
      <span>LARGO — objetos para o cotidiano</span>
      <span>© 2026 LARGO. Todos os direitos reservados.</span>
    </div>
  </footer>

  <script src="assets/products.js"></script>
  <script src="assets/cart.js"></script>
  <script src="assets/menu.js"></script>
  <script type="module" src="assets/firebase.js"></script>
</body>
</html>
