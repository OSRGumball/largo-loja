<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — LARGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/motion.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section" style="padding-top: 3rem;">
    <div class="wrap">
      <span class="eyebrow">Sua sacola</span>
      <h2 style="margin-top: 0.5rem; margin-bottom: 2.5rem;">Checkout</h2>

      <div class="checkout-grid">
        <div>
          <div id="cartList"></div>
        </div>

        <div>
          <div class="summary">
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="subtotal">R$ 0,00</span>
            </div>
            <div class="summary-row">
              <span>Frete</span>
              <span>Calculado no pagamento</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="total">R$ 0,00</span>
            </div>

            <!-- Container onde o Payment Brick do Mercado Pago será renderizado -->
            <div id="paymentBrick_container" style="margin-top: 1.5rem;"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap footer-inner">
      <span>LARGO — objetos para o cotidiano</span>
      <span>© 2026 LARGO. Todos os direitos reservados.</span>
    </div>
  </footer>

  <script src="assets/products.js"></script>
  <script src="assets/cart.js"></script>
  <script src="assets/menu.js"></script>
  <script type="module" src="assets/firebase.js"></script>

  <!-- SDK do Mercado Pago -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>

  <script>
    const cartListEl = document.getElementById("cartList");
    const subtotalEl = document.getElementById("subtotal");
    const totalEl = document.getElementById("total");

    function renderCart() {
      const cart = getCart();

      if (cart.length === 0) {
        cartListEl.innerHTML = `<div class="empty-state">
          <p>Sua sacola está vazia.</p>
          <a href="produtos.html" class="btn btn-outline btn-sm" style="margin-top: 1rem;">Ver produtos</a>
        </div>`;
        subtotalEl.textContent = formatBRL(0);
        totalEl.textContent = formatBRL(0);
        document.getElementById("paymentBrick_container").innerHTML = "";
        return;
      }

      cartListEl.innerHTML = cart
        .map((item) => {
          const p = PRODUCTS.find((prod) => prod.id === item.id);
          if (!p) return "";
          return `<div class="cart-row">
            <img src="${p.img}" alt="${p.name}" />
            <div class="info">
              <span class="name">${p.name}</span>
              <span class="ref">${p.ref}</span>
              <div class="qty-control" style="margin-top: 0.5rem;">
                <button onclick="changeQty('${p.id}', -1); renderCart();">−</button>
                <span>${item.qty}</span>
                <button onclick="changeQty('${p.id}', 1); renderCart();">+</button>
                <button class="remove" onclick="removeFromCart('${p.id}'); renderCart();">remover</button>
              </div>
            </div>
            <span class="price">${formatBRL(p.price * item.qty)}</span>
          </div>`;
        })
        .join("");

      const total = cartTotal();
      subtotalEl.textContent = formatBRL(total);
      totalEl.textContent = formatBRL(total);

      initPaymentBrick(total);
    }

    // ---------------------------------------------------------------
    // Integração Mercado Pago — Payment Brick
    // ---------------------------------------------------------------
    // 1. Troque 'SUA_PUBLIC_KEY' pela sua chave pública (painel do Mercado Pago).
    // 2. O Brick só coleta os dados de pagamento com segurança no front-end.
    //    Para efetivar a cobrança, você precisa de um backend simples que:
    //      a) receba os dados do callback onSubmit abaixo
    //      b) chame a API do Mercado Pago (POST /v1/payments) com seu ACCESS TOKEN
    //         (esse token NUNCA pode ficar no front-end)
    //      c) devolva o resultado (aprovado/pendente/recusado) para o front
    //    Isso pode ser uma função serverless (Vercel/Netlify) ou um endpoint próprio.
    // ---------------------------------------------------------------
    // Tela de resultado: limpa a sacola e mostra aprovado / pendente (Pix) / recusado.
    function showResult(data) {
      if (data.status === "rejected") {
        alert("Pagamento recusado. Tente outro cartão ou método.");
        return; // mantém a sacola pra tentar de novo
      }

      localStorage.removeItem(CART_KEY);
      updateCartBadge();
      if (brickController) {
        brickController.unmount();
        brickController = null;
      }
      cartListEl.innerHTML = "";

      const box = document.querySelector(".summary");
      box.innerHTML = "";

      const title = document.createElement("h3");
      title.style.fontFamily = "var(--font-display)";
      title.style.marginBottom = "0.75rem";
      const text = document.createElement("p");
      text.style.color = "var(--ink-soft)";
      box.append(title, text);

      if (data.status === "approved") {
        title.textContent = "Pagamento aprovado";
        text.textContent = "Obrigado pela compra!";
      } else if (data.pix) {
        title.textContent = "Falta pouco: pague com Pix";
        text.textContent = "Escaneie o QR Code ou use o Pix copia e cola. O pedido é confirmado assim que o pagamento cair.";
        if (data.pix.qr_code_base64) {
          const img = document.createElement("img");
          img.src = "data:image/png;base64," + data.pix.qr_code_base64;
          img.alt = "QR Code Pix";
          img.style.cssText = "width:200px;margin:1rem auto;";
          box.append(img);
        }
        if (data.pix.qr_code) {
          const code = document.createElement("textarea");
          code.readOnly = true;
          code.value = data.pix.qr_code;
          code.style.cssText = "width:100%;height:90px;margin-top:0.75rem;font-family:var(--font-mono);font-size:0.75rem;";
          const copy = document.createElement("button");
          copy.className = "btn btn-outline btn-sm";
          copy.style.marginTop = "0.5rem";
          copy.textContent = "Copiar código";
          copy.onclick = () => navigator.clipboard.writeText(data.pix.qr_code).then(() => (copy.textContent = "Copiado ✓"));
          box.append(code, copy);
        }
        if (data.pix.ticket_url) {
          const link = document.createElement("a");
          link.href = data.pix.ticket_url;
          link.target = "_blank";
          link.rel = "noopener";
          link.className = "btn btn-primary btn-sm";
          link.style.cssText = "display:inline-flex;margin-top:0.75rem;margin-left:0.5rem;";
          link.textContent = "Abrir página do Pix";
          box.append(link);
        }
      } else {
        title.textContent = "Pagamento em análise";
        text.textContent = "Avisaremos assim que for confirmado.";
      }
    }

    let brickController;

    async function initPaymentBrick(amount) {
      if (amount <= 0) return;
      const container = document.getElementById("paymentBrick_container");
      container.innerHTML = "";

      if (brickController) {
        brickController.unmount();
      }

      const mp = new MercadoPago("APP_USR-xxxxxxxx-xxxxxx-xxxxxxxxxxxxxxxxxxxxxxxx-xxxxxxxxx", { locale: "pt-BR" });
      const bricksBuilder = mp.bricks();

      brickController = await bricksBuilder.create("payment", "paymentBrick_container", {
        initialization: {
          amount: amount,
        },
        customization: {
          paymentMethods: {
            creditCard: "all",
            debitCard: "all",
            bankTransfer: "all", // habilita Pix
          },
        },
        callbacks: {
          onReady: () => {},
          onSubmit: ({ selectedPaymentMethod, formData }) => {
            // Manda só id/qty; o servidor recalcula o total com o catálogo dele.
            const cartItems = getCart().map(({ id, qty }) => ({ id, qty }));

            return new Promise((resolve, reject) => {
              fetch("/api/process_payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ formData, selectedPaymentMethod, items: cartItems }),
              })
                .then((res) => res.json())
                .then(async (data) => {
                  console.log("Pedido processado:", data);

                  if (data.error) {
                    alert("Não foi possível processar o pagamento: " + data.error);
                    reject();
                    return;
                  }

                  // Salva o pedido no Firestore (uid fica null para visitante).
                  // Falha ao salvar não deve esconder um pagamento já feito.
                  try {
                    const items = getCart().map((item) => {
                      const p = PRODUCTS.find((prod) => prod.id === item.id);
                      return { id: item.id, name: p?.name, qty: item.qty, price: p?.price };
                    });
                    await window.largoSaveOrder({ items, total: cartTotal(), status: data.status });
                  } catch (e) {
                    console.error("Erro ao salvar pedido:", e);
                  }

                  showResult(data);
                  resolve();
                })
                .catch((err) => {
                  console.error(err);
                  alert("Erro de conexão ao processar o pagamento. Tente novamente.");
                  reject();
                });
            });
          },
          onError: (error) => console.error(error),
        },
      });
    }

    renderCart();
  </script>
  <script src="assets/motion.js" defer></script>
</body>
</html>
